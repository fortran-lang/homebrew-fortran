name: version detector

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/version_detector.yml
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: version-detector
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.10.26.1
        with:
          core: true

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@2026.10.26.1

      - name: Bump formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --formulae --bump-synced --tap="$TAP_NAME"

  alert:
    name: Report failure
    needs: detect
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="version detector failed"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$(cat <<EOF
          The version detector failed, so new releases will not be picked up until it is fixed.

          Run: ${RUN_URL}

          Check the run log for details. Close this issue once the detector is passing again.
          EOF
          )"
          fi
