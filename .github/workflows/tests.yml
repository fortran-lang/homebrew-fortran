name: test

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      formulae:
        description: Formulae to test
        default: lfortran
        required: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-15
            arch: arm64
          - os: ubuntu-latest
            arch: x86_64
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          - os: ubuntu-24.04-arm
            arch: arm64
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    # Linux builds run inside Homebrew's image so bottles target its pinned glibc,
    # not whatever the runner image happens to ship. `null` here disables the container.
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    timeout-minutes: 120
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.09.28.1

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-${{ matrix.arch }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Test formulae
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae

      - name: Test formulae (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: brew test-bot --only-formulae --testing-formulae=${{ inputs.formulae }}

      - name: Upload bottles as artifact
        if: always() && (github.event_name == 'pull_request')
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}_${{ matrix.arch }}
          path: "*.bottle.*"
